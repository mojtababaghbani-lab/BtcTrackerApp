
name: Build APK from ZIP

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Extract ZIP file
      run: |
        unzip -o "btc-tracker (2).zip" -d extracted_project
        echo "--- محتوای پوشه استخراج‌شده ---"
        ls -la extracted_project/
    
    - name: Find project root
      id: find_root
      run: |
        if [ -f "extracted_project/gradlew" ]; then
          echo "PROJECT_ROOT=extracted_project" >> $GITHUB_OUTPUT
        elif [ -d "extracted_project/btc-tracker (2)" ]; then
          echo "PROJECT_ROOT=extracted_project/btc-tracker (2)" >> $GITHUB_OUTPUT
        else
          echo "PROJECT_ROOT=$(find extracted_project -name gradlew -exec dirname {} \; | head -1)" >> $GITHUB_OUTPUT
        fi
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    
    - name: Create local.properties
      run: |
        cd ${{ steps.find_root.outputs.PROJECT_ROOT }}
        echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
    
    - name: Grant execute permission for gradlew
      run: |
        cd ${{ steps.find_root.outputs.PROJECT_ROOT }}
        chmod +x gradlew
    
    - name: Build with Gradle
      run: |
        cd ${{ steps.find_root.outputs.PROJECT_ROOT }}
        ./gradlew assembleDebug --no-daemon --stacktrace
    
    - name: Find APK file
      run: |
        find ${{ steps.find_root.outputs.PROJECT_ROOT }} -name "*.apk" -type f
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: ${{ steps.find_root.outputs.PROJECT_ROOT }}/**/*.apk
