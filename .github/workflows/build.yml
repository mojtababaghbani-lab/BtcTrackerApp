name: Build APK from ZIP

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Extract ZIP file
      run: |
        unzip -o "btc-tracker (2).zip" -d extracted_project
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    
    - name: Grant execute permission for gradlew
      run: |
        cd extracted_project
        chmod +x gradlew || true
    
    - name: Build with Gradle
      run: |
        cd extracted_project
        ./gradlew assembleDebug --no-daemon || gradle assembleDebug --no-daemon
    
    - name: Find APK file
      run: |
        find extracted_project -name "*.apk" -type f
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: extracted_project/**/*.apk
